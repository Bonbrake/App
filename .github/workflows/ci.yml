name: ComfyUIX Matrix CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Primary Functional QA Suite (60 Tests)
        run: |
          python qa_suite.py

      - name: Run Multi-Angle Deep Stress & Math Suite (62 Tests)
        run: |
          python multi_angle_debug.py

      - name: Upload QA Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-py${{ matrix.python-version }}
          path: |
            qa_report.json
            qa_report.md
