name: Build & Release ComfyUIX Matrix Executable

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow customtkinter

      - name: Run Full QA Test Suites Before Build
        run: |
          python qa_suite.py
          python multi_angle_debug.py

      - name: Build Standalone Windows Executable
        run: |
          pyinstaller ComfyUI_Uncensored.spec --noconfirm --clean

      - name: Generate Checksums (SHA-256)
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/ComfyUIX.exe).Hash
          Set-Content -Path "dist/ComfyUIX.exe.sha256" -Value "$hash  ComfyUIX.exe"
          Write-Output "SHA256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ComfyUIX.exe
            dist/ComfyUIX.exe.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
