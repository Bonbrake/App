name: 💡 Feature / QoL Request
description: Suggest an idea, Quality of Life improvement, or workflow enhancement for ComfyUIX
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make ComfyUIX faster, cleaner, or more capable? We'd love to hear it!

  - type: textarea
    id: feature_summary
    attributes:
      label: Feature / QoL Summary
      description: What would you like to see added or improved?
      placeholder: "e.g., Add support for FLUX.1 NF4 quantized checkpoint loader..."
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Problem / Workflow Motivation
      description: Explain the problem this feature solves or how it improves the creator workflow.
      placeholder: "Currently, doing X requires Y steps..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Any alternative workflows, nodes, or mockups you've considered.
