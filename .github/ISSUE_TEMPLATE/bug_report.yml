name: 🐛 Bug Report
description: Report a bug or issue in ComfyUIX Matrix Edition
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with **ComfyUIX Matrix Edition**!
        Please fill in the details below to help us reproduce and resolve the problem quickly.

  - type: input
    id: version
    attributes:
      label: ComfyUIX Version
      description: What version or build of ComfyUIX are you running?
      placeholder: "e.g., v5.0.0-Matrix"
    validations:
      required: true

  - type: input
    id: os_gpu
    attributes:
      label: Windows OS & GPU Hardware
      description: Specify your Windows version and GPU details.
      placeholder: "e.g., Windows 11 23H2, NVIDIA RTX 4070 12GB VRAM"
    validations:
      required: true

  - type: dropdown
    id: studio_tab
    attributes:
      label: Studio Mode / Component
      options:
        - Text to Image
        - Image to Image / Inpainting Canvas
        - Upscale
        - Text to Video / Video to Video
        - Video Refine & Upscale
        - Audio Synthesis
        - PBR Texture Studio
        - Model Vault & Downloader
        - Matrix AI HUD Copilot
        - General Desktop GUI / Window Layout
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open ComfyUIX
        2. Select '...'
        3. Click '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Diagnostic Logs / Traceback
      description: Paste any relevant logs from the Debug Console, `logs/ComfyUI_App.log`, or `qa_report.json`.
      render: shell
